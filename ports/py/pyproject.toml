[project]
name = "aduku"
version = "0.0.1"
description = "aduku-py: append-only ledger of contributions merged into documents by a central annotated schema"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sanil Mohandas" }]
dependencies = [
    "amazon.ion>=0.11",
    "python-ulid>=3.0",
]

[project.scripts]
aduku = "aduku.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aduku"]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/aduku"]

[[tool.mypy.overrides]]
module = ["amazon.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# `ruff format` wraps code; remaining long lines are SQL and message strings.
ignore = ["E501"]
